# yaml-language-server: $schema=./serverk.schema.json
schemaVersion: serverk.gg/v1
kind: GamePackage

metadata:
  id: minecraft-bedrock
  name:
    ar: ماينكرافت بيدروك
    en: Minecraft Bedrock
  description:
    ar: سيرفر ماينكرافت بيدروك أصلي يجمع الجوال والكونسول وويندوز في الماب نفسه، ويشتغل فورًا دون أي إعداد.
    en: A native Minecraft Bedrock server with phone, console and Windows players in one world, running the moment your order completes.
  tagline:
    ar: العب مع أصحابك من أي جهاز، وسيرفرك جاهز خلال دقيقة
    en: Play with your friends from any device, with your server ready in a minute
  category: sandbox
  logo: assets/logo.webp
  banner: assets/banner.webp
  extensions:
    - kind: addons
      sources:
        - curseforge

mojang:
  channelVariable: BEDROCK_CHANNEL
  buildVariable: BEDROCK_VERSION

resources:
  minMemoryMb: 512
  recommendedMemoryMb: 1024
  minDiskMb: 5120
  playersPerMemoryGb: 10
  maxRecommendedPlayers: 64

container:
  image: serverkgg/minecraft-bedrock
  runtime:
    platform: linux
    installBudgetMinutes: 10
    bootBudgetMinutes: 6
    shmMb: 64
    pidsLimit: 512
  ports:
    - key: game
      containerPort: 19132
      protocol: tcp+udp
      mirror: true
      join: separate
      name:
        ar: بيدروك
        en: Bedrock
      hint:
        ar: في بيدروك، اكتب العنوان في خانة «عنوان السيرفر» والمنفذ في خانة «المنفذ».
        en: In Bedrock, type the address in the "Server Address" field and the port in the "Port" field.
      hostRange:
        default: 19132
        min: 19132
        max: 19231
    - key: media
      containerPort: 20000
      protocol: udp
      mirror: true
      count: 64
      hostRange:
        default: 20000
        min: 20000
        max: 26399

backup:
  only:
    - config/**
    - .serverk-install.json
    - worlds/**
    - server.properties
    - allowlist.json
    - permissions.json
    - behavior_packs/**
    - resource_packs/**
    - development_behavior_packs/**
    - development_resource_packs/**
    - world_templates/**
    - .serverk-packs.json
    - .serverk-players.json
  except:
    - worlds/*/db/LOCK
    - worlds/*/db/LOG
    - worlds/*/db/LOG.old
    - behavior_packs/vanilla*/**
    - resource_packs/vanilla*/**
    - behavior_packs/chemistry*/**
    - resource_packs/chemistry*/**
    - resource_packs/education*/**

reset:
  keep:
    - .serverk-install.json
    - .serverk-packs.json
    - .serverk-players.json
    - bedrock_server
    - "*.so"
    - libMinecraft.Server.Lib.a
    - behavior_packs
    - resource_packs
    - config
    - data
    - definitions
    - minecraftpe
    - treatments
    - premium_cache
    - packetlimitconfig.json
    - profanity_filter.wlist
    - valid_known_packs.json
    - release-notes.txt
    - bedrock_server_how_to.html

secrets:
  - key: CURSEFORGE_API_KEY
    description:
      ar: مفتاح CurseForge API. بدونه يبقى كتالوج الإضافات موقوفًا، ويظل رفع الإضافات يدويًا متاحًا.
      en: CurseForge API key. Without it, the add-on catalog stays off, but you can still upload your own add-ons.
    required: false

presence:
  name: player
  id: xuid
  fields:
    - key: xuid
      label:
        ar: معرّف اللاعب
        en: Account id
    - key: permission
      label:
        ar: الصلاحية
        en: Permission

files:
  protected:
    - .serverk-transaction.json
    - .serverk-recovery-files/**
    - .serverk-world-clone/**
    - .serverk-world-export/**
    - .serverk-level/**
    - .serverk-download/**
    - .serverk-staging/**
    - .serverk-install.json
    - .serverk-packs.json
    - .serverk-players.json
  notable:
    - match: server.properties
      label:
        ar: إعدادات
        en: Settings
      icon: settings
      color: "#5ba32b"
      restart: true
      note:
        ar: "إعدادات السيرفر الأساسية: الاسم وعدد اللاعبين والصعوبة ووضع اللعب. أي تعديل يتطلب ريستارت."
        en: "The core server settings: name, player slots, difficulty and game mode. Any change needs a restart."
    - match: worlds
      label:
        ar: المابات
        en: Worlds
      icon: map
      color: "#4a8fd4"
      note:
        ar: كل ماباتك هنا، ولكل ماب مجلد خاص به. لا تحذف أي شيء إلا إذا كنت متأكدًا، وخذ نسخة احتياطية قبل أي تعديل.
        en: All your worlds live here, one folder each. Don't delete anything unless you're sure, and take a backup before you change anything.
    - match: "worlds/**"
      label:
        ar: بيانات الماب
        en: World data
      icon: map
      color: "#4a8fd4"
      note:
        ar: جزء من بيانات الماب. في بيدروك يُحفظ الأوفرورلد والنذر والإند في قاعدة بيانات واحدة، وتعديلها والسيرفر شغّال يتلف الماب.
        en: Part of your world data. On Bedrock the Overworld, Nether and End all live in one database, and editing it while the server runs will corrupt the world.
    - match: allowlist.json
      label:
        ar: القائمة البيضاء
        en: Allowlist
      icon: users
      color: "#e0a458"
      note:
        ar: القائمة البيضاء. عند تفعيلها، لا يدخل إلا اللاعبون الموجودون هنا، وهي الطريقة الوحيدة لمنع لاعب من الدخول في بيدروك.
        en: The allowlist. When it's on, only the players here can join. It's your only way to keep a player out on Bedrock.
    - match: permissions.json
      label:
        ar: الصلاحيات
        en: Permissions
      icon: shield
      color: "#e0a458"
      restart: true
      note:
        ar: صلاحيات اللاعبين. يحفظها بيدروك بمعرّف اللاعب (XUID) وليس بالاسم، لذلك يلزم أن يدخل اللاعب مرة واحدة قبل أن تجعله أوبريتر.
        en: Player permissions. Bedrock stores these by account id (XUID), not by name, which is why a player has to join once before you can make them an operator.
    - match: behavior_packs
      label:
        ar: إضافات السلوك
        en: Behavior packs
      icon: puzzle
      color: "#c77dff"
      restart: true
      note:
        ar: إضافات السلوك التي تغيّر الوحوش والأغراض وقوانين اللعبة. ارفع الإضافات من تبويب الإضافات، فالملف الذي تضعه هنا لا يُثبَّت إلا عند الضغط على «أصلح الإضافات».
        en: Behavior packs change mobs, items and game rules. Upload add-ons from the Add-ons tab. A file dropped here isn't installed until you press Repair add-ons.
    - match: resource_packs
      label:
        ar: إضافات المظهر
        en: Resource packs
      icon: puzzle
      color: "#c77dff"
      restart: true
      note:
        ar: إضافات المظهر للأشكال والأصوات. يُعرض على كل لاعب تنزيلها عند دخوله السيرفر، ويستطيع رفض التنزيل، أما إذا فعّلت «إلزام إضافة المظهر» فيُطرد من يرفض. ارفع الإضافات من تبويب الإضافات، فالملف الذي تضعه هنا لا يُثبَّت إلا عند الضغط على «أصلح الإضافات».
        en: Resource packs change textures and sounds. Each player is offered the download on joining and can decline it. With Require the resource pack on, a player who declines is disconnected. Upload add-ons from the Add-ons tab. A file dropped here isn't installed until you press Repair add-ons.
    - match: valid_known_packs.json
      label:
        ar: فهرس الإضافات
        en: Pack index
      icon: box
      color: "#8d99ae"
      restart: true
      note:
        ar: فهرس السيرفر للإضافات المثبّتة. يكتبه السيرفر بنفسه، فلا تعدّله.
        en: The server's own index of installed add-ons. The server writes it itself, so don't edit it.

guideTags:
  - id: start
    name:
      ar: ابدأ من هنا
      en: Start here
  - id: features
    name:
      ar: مميزات
      en: Features

guides:
  - id: getting-started
    title:
      ar: البدء بسيرفرك
      en: Getting started
    summary:
      ar: من إنشاء السيرفر حتى دخول أول لاعب من الجوال أو الكونسول أو ويندوز.
      en: From creating the server to the first player joining on phone, console or Windows.
    tags:
      - start
    surfaces:
      - overview
      - console
      - setup
    bodyPath:
      ar: guides/getting-started/ar.md
      en: guides/getting-started/en.md
  - id: players
    title:
      ar: "اللاعبون: القائمة البيضاء والأوبريتر"
      en: "Players: the allowlist and operators"
    summary:
      ar: كيف تتحكم في من يدخل سيرفرك ومن يستطيع استخدام أوامر الإدارة، وسبب اختلاف بيدروك في ذلك.
      en: How to control who joins and who can run admin commands, and why Bedrock works the way it does.
    tags:
      - features
    surfaces:
      - panel
      - console
    bodyPath:
      ar: guides/players/ar.md
      en: guides/players/en.md
  - id: worlds
    title:
      ar: "المابات: الرفع والتبديل والحماية"
      en: "Worlds: upload, switch and keep safe"
    summary:
      ar: ارفع مابك من جوالك، وبدّل بين المابات، ونفّذ ريسيت للماب المفعّل بالسيد نفسه أو من نسخة تحتفظ بها، واعرف لماذا تُعد النسخة الاحتياطية أهم شيء في بيدروك.
      en: Upload a world from your phone, switch between worlds, reset the active world from its own seed or from a copy you keep, and understand why backups matter most on Bedrock.
    tags:
      - features
    surfaces:
      - panel
      - files
      - backups
    bodyPath:
      ar: guides/worlds/ar.md
      en: guides/worlds/en.md
  - id: addons
    title:
      ar: "الإضافات: السلوك والمظهر"
      en: "Add-ons: behavior and resource packs"
    summary:
      ar: ثبّت إضافات من الكتالوج أو ارفع ملف mcaddon بنفسك، ثم فعّلها على مابك.
      en: Install add-ons from the catalog or upload your own .mcaddon, then activate them on your world.
    tags:
      - features
    surfaces:
      - panel
    bodyPath:
      ar: guides/addons/ar.md
      en: guides/addons/en.md
  - id: preview
    title:
      ar: "إصدار البريفيو: جرّب الجديد قبل الجميع"
      en: "The preview build: try what's coming next"
    summary:
      ar: ما هو إصدار البريفيو، ومتى تستخدمه، ولماذا يصعب الرجوع منه إلى الإصدار العادي.
      en: What the preview build is, when to use it, and why going back to release is hard.
    tags:
      - start
    surfaces:
      - panel
      - overview
    bodyPath:
      ar: guides/preview/ar.md
      en: guides/preview/en.md
